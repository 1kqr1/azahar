# 妖怪ウォッチ版: Windows 版（zip）と Android 版（apk）をビルドする
# どちらも「妖怪ウォッチ2 ローカル通信修正」が入る。
# ランチャー・ROMフォルダ・CIA自動インストールは PC 版（Qt）の機能なので Windows 版のみ。
name: yokai-windows-android

on:
  push:
    branches: [ yokai-edition ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: yokai-windows-${{ github.sha }}
          restore-keys: yokai-windows-
      - name: Set up MSVC
        uses: azahar-emu/msvc-dev-cmd@v1
      - name: Install tools
        run: choco install ccache ninja wget
      - name: Install Vulkan SDK
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_FFMPEG=OFF \
            -DENABLE_ROOM_STANDALONE=OFF
          ninja
          ninja bundle
          strip -s bundle/*.exe || true
      - name: Pack
        run: |
          mkdir -p artifacts "Azahar-YW-Edition-Windows"
          cp -r build/bundle/* "Azahar-YW-Edition-Windows/"
          cp "dist/yokai/Windowsでの使い方.txt" "dist/yokai/通信のやり方.txt" "Azahar-YW-Edition-Windows/"
          powershell Compress-Archive "Azahar-YW-Edition-Windows" "artifacts/Azahar-YW-Edition-Windows.zip"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Azahar-YW-Edition-Windows
          path: artifacts/*.zip

  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: yokai-android-${{ github.sha }}
          restore-keys: yokai-android-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache -y
      - name: Update Android SDK CMake version
        run: echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        # relWithDebInfoLite = 公式Azaharと別アプリ扱い（パッケージ名に .debug が付く）なので、
        # 公式版を消さずに並べてインストールできる。署名はデバッグ鍵。
        run: |
          export NDK_CCACHE=$(which ccache)
          cd src/android
          chmod +x ./gradlew
          JAVA_HOME=$JAVA_HOME_17_X64 ./gradlew assembleVanillaRelWithDebInfoLite
      - name: Pack
        run: |
          mkdir -p artifacts
          find src/android/app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/Azahar-YW-Edition-Android.apk \;
          ls -la artifacts
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Azahar-YW-Edition-Android
          path: artifacts/*.apk
